id: "textshadow-ai"
detail:
  showcaseImageSrc: "./assets/img-textshadow-thumbnail.png"
  showcaseImageAlt: "Text shadow AI behavior project thumbnail showing generated design styling"
  popupSections:
    -
      label: "Context"
      title: "Text shadow had to become a controllable product behavior, not just a visual effect"
      asideImageSrc: "./assets/textshadow-context.png"
      asideImageAlt: "Illustration showing text shadow improving readability across different background types"
      body:
        - "Text shadow improves readability on complex backgrounds such as images and gradients."
        - "In traditional workflows, designers apply it manually. In an AI-driven environment, this behavior must be automated while still maintaining consistency and visual quality."
        - "This turned text shadow into a product problem, not just a design detail."
    -
      label: "Problem"
      title: "AI could generate text shadow, but could not apply it consistently"
      body:
        - "AI could generate text shadow, but lacked clear design logic and product support. The result was inconsistent behavior, weak context awareness, and outputs that could not be fully rendered or edited in the canvas."
      columns:
        -
          number: "01"
          coverImageSrc: "./assets/textshadow-readability-patterns.png"
          coverImageAlt: "Examples of text shadow improving readability on image and low-contrast backgrounds"
          title: "Market Reality"
          body: "Text shadow improves readability on images and low-contrast backgrounds."
          bullets:
            - "Supports readability and hierarchy"
            - "Common in real UI"
            - "Functional, not decorative"
        -
          number: "02"
          coverImageSrc: "./assets/textshadow-ai-behavior-gap.png"
          coverImageAlt: "AI behavior gap illustration showing inconsistent text shadow decisions"
          title: "AI Limitation"
          body: "AI could generate text shadow, but lacked contextual understanding."
          bullets:
            - "Inconsistent behavior"
            - "Weak decision logic"
            - "Incorrect or missing shadow usage"
        -
          number: "03"
          coverImageSrc: "./assets/textshadow-canvas-support-gap.png"
          coverImageAlt: "Canvas support gap illustration showing AI text shadow output not editable in product"
          title: "Product Gap"
          body: "The design canvas did not support text shadow rendering."
          bullets:
            - "AI output could not appear in the canvas"
            - "No editable text shadow controls"
            - "Output unusable in real workflows"
      action:
        label: "Detail"
        href: "./projects/textshadow/problem.html"
    -
      label: "Challenges"
      title: "Designing AI Behavior in a Real Product Context"
      body:
        - "The challenge was not only generating text shadow, but making AI behavior consistent, controllable, and usable inside a real product system."
      displayAs: "simpleCards"
      columns:
        -
          title: "Translate design intent"
          body: "Human design decisions had to be translated into structured AI rules."
          tag: "AI Behavior"
        -
          title: "Improve context awareness"
          body: "AI needed to understand when text shadow helps readability and when it should be avoided."
          tag: "Validation"
        -
          title: "Balance consistency and flexibility"
          body: "The system needed predictable output while still allowing users to edit values."
          tag: "Product Thinking"
        -
          title: "Align with canvas rendering"
          body: "Generated output had to map to product-supported values that could render in the canvas."
          tag: "System Design"
    -
      label: "Solution"
      title: "Dual-System Approach for Humans and AI"
      body:
        - "A dual-system approach connected UX interaction and AI behavior to create consistent, editable, and context-aware text shadow generation."
      columns:
        -
          coverImageSrc: "./assets/textshadow-solution-ai.png"
          coverImageAlt: "Illustration representing the AI behavior branch of the dual-system approach"
          title: "AI Behavior System"
          branchLabel: "AI Branch"
          subsections:
            -
              label: "Focus"
              bullets:
                - "Rule-based AI behavior"
                - "Context-aware generation"
                - "Preset-constrained output"
            -
              label: "Outcome"
              body: "More consistent AI-generated shadows"
          action:
            label: "Detail"
            href: "./projects/textshadow/ai-branch.html"
        -
          coverImageSrc: "./assets/textshadow-solution-human.png"
          coverImageAlt: "Illustration representing the UX/UI human branch of the dual-system approach"
          title: "UX/UI System"
          branchLabel: "Human Branch"
          subsections:
            -
              label: "Focus"
              bullets:
                - "Preset-based interaction"
                - "Editable controls"
                - "Real-time preview on canvas"
            -
              label: "Outcome"
              body: "Predictable and controllable output"
          action:
            label: "Detail"
            href: "./projects/textshadow/human-branch.html"
      diagramLabel: "End-to-End Process"
      diagramCaption: "Both systems worked together through continuous testing, validation, and refinement between UX behavior, AI logic, and canvas rendering."
      diagramImageSrc: "./assets/textshadow-solution-process.png"
      diagramImageAlt: "End-to-end process diagram showing the dual-track flow between the UX/UI human branch and the AI behavior branch with iteration loops"
    -
      label: "Decision and Trade-offs"
      title: "Trade-offs That Shaped the System"
      body:
        - "The system prioritized consistency, control, and editability over unrestricted AI generation."
      displayAs: "table"
      columns:
        -
          number: "01"
          title: "Preset-based system over free-form styling"
          subsections:
            -
              label: "Trade-off"
              body: "Less flexibility"
            -
              label: "Result"
              body: "More predictable and scalable output"
        -
          number: "02"
          title: "Rule-based AI over unrestricted generation"
          subsections:
            -
              label: "Trade-off"
              body: "Less creative variation"
            -
              label: "Result"
              body: "More reliable AI behavior"
        -
          number: "03"
          title: "System constraints over visual freedom"
          subsections:
            -
              label: "Trade-off"
              body: "Limited output range"
            -
              label: "Result"
              body: "More consistent and feasible rendering"
        -
          number: "04"
          title: "Editable output over full automation"
          subsections:
            -
              label: "Trade-off"
              body: "More UI complexity"
            -
              label: "Result"
              body: "Greater user trust and control"
    -
      label: "System Integration"
      title: "Human ↔ AI System Integration"
      body:
        - "A mapping layer connects UX logic, AI behavior, and canvas rendering."
        - "This makes text shadow consistent, editable, and usable in the product."
      displayAs: "simpleCards"
      columns:
        -
          iconSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.75\" stroke=\"currentColor\" class=\"h-7 w-7\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75\"/></svg>"
          title: "UX/UI layer"
          body: "Gives users control through presets and editable shadow values."
        -
          iconSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.75\" stroke=\"currentColor\" class=\"h-7 w-7\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z\"/></svg>"
          title: "AI behavior layer"
          body: "Automates styling decisions through structured rules and preset logic."
        -
          iconSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3\"/><path d=\"M16 3h3a2 2 0 0 1 2 2v3\"/><path d=\"M8 21H5a2 2 0 0 1-2-2v-3\"/><path d=\"M16 21h3a2 2 0 0 0 2-2v-3\"/><path d=\"M12 8v8\"/><path d=\"m8 12 4 4 4-4\"/></svg>"
          title: "Mapping layer"
          body: "Connects UX behavior, AI output, and canvas rendering."
          bullets:
            - "AI output maps to predefined presets"
            - "Values remain editable in the UI"
            - "Outputs stay consistent and renderable"
        -
          iconSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><path d=\"M21 12a9 9 0 1 1-6.7-8.7\"/></svg>"
          title: "Product outcome"
          body: "Text shadow becomes:"
          bullets:
            - "Renderable on the canvas"
            - "Editable in the UI"
            - "Reliable in real workflows"
      diagramLabel: "How the layers connect"
      diagramCaption: "UX logic, AI behavior, mapping, and canvas rendering connect into a renderable and editable output."
      diagramImageAlt: "Animated diagram showing how the UX layer and AI layer connect through a mapping mechanism into the Canvas layer"
      diagramImageLoop:
        -
          src: "./assets/textshadow-system-itergration-connect-1.png"
          alt: "Step 1 — UX layer and AI layer shown side by side"
        -
          src: "./assets/textshadow-system-itergration-connect-2.png"
          alt: "Step 2 — mapping mechanism connecting both layers"
        -
          src: "./assets/textshadow-system-itergration-connect-3.png"
          alt: "Step 3 — combined output rendered on the Canvas layer"
      action:
        label: "Detail"
        href: "./projects/textshadow/system-integration.html"
    -
      label: "Human-AI Feedback Loop"
      title: "Human ↔ AI Feedback Loop"
      body:
        - "AI behavior improves through continuous interaction, evaluation, and refinement between users, UX logic, and AI systems."
      displayAs: "simpleCardsWithIcon"
      columns:
        -
          iconSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m16 3 4 4-4 4\"/><path d=\"M20 7H4\"/><path d=\"m8 21-4-4 4-4\"/><path d=\"M4 17h16\"/></svg>"
          title: "Interaction Cycle"
          branchLabel: "Cycle"
          subsections:
            -
              bullets:
                - "UX defines rules and presets"
                - "AI generates output"
                - "Users adjust and refine results"
            -
              label: "Outcome"
              body: "AI assists decisions while users stay in control."
        -
          iconSvg: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16\"/><path d=\"M8 16H3v5\"/></svg>"
          title: "Iteration Loop"
          branchLabel: "Process"
          subsections:
            -
              bullets:
                - "Test and evaluate outputs"
                - "Identify issues and patterns"
                - "Refine rules and prompts"
            -
              label: "Outcome"
              body: "The system becomes more reliable over time."
      highlight:
        label: "Core insight"
        body: "Interaction generates feedback. Iteration transforms that feedback into more accurate, consistent, and reliable AI behavior over time."
      imageLoop:
        images:
          -
            src: "./assets/textshadow-image-human-ai.png"
            alt: "Visual showing the human-AI feedback loop in action"
          -
            src: "./assets/textshadow-image-system-integration.png"
            alt: "Visual showing how the system integration connects layers"
    -
      label: "Results & Impact"
      title: "From Inconsistent Outputs to a More Reliable System"
      body:
        - "The system improved AI consistency, editability, and usability across real product workflows."
      groups:
        -
          label: "What Changed / Impact"
          displayAs: "simpleCards"
          columns:
            -
              title: "Before"
              bullets:
                - "Inconsistent AI-generated shadows"
                - "Weak decision logic"
                - "No editable canvas support"
            -
              title: "After"
              bullets:
                - "Rule-based AI behavior"
                - "Consistent preset mapping"
                - "Editable UI output"
            -
              title: "User Impact"
              bullets:
                - "More predictable AI output"
                - "Easier refinement and control"
                - "Less manual correction"
            -
              title: "Product Impact"
              bullets:
                - "Standardized text shadow behavior"
                - "Scalable AI styling foundation"
                - "Better UX ↔ AI ↔ rendering alignment"
        -
          label: "Quality Improvements"
          metrics:
            -
              metric: "AI output consistency across structured validation scenarios"
              result: "More consistent rule application"
            -
              metric: "Incorrect or weak shadow usage during validation"
              result: "~30% reduction"
            -
              metric: "Readability across tested UI contexts"
              result: "~30% improvement"
            -
              metric: "Directional system reliability in prompt-based evaluation"
              result: "~70% reliability"
      imageSrc: "./assets/textshadow-results-impact.png"
      imageAlt: "Results and impact visual showing improved AI text shadow consistency and editable output"
    -
      label: "Learning"
      title: "Designing AI as a System, Not a Feature"
      body:
        - "AI features require structure, alignment, and continuous refinement - not only generation."
      displayAs: "simpleCards"
      columns:
        -
          number: "01"
          title: "From Feature to System Thinking"
          body: "AI features require behavior logic, rendering support, and product integration."
        -
          number: "02"
          title: "Structured Rules Create Reliable AI"
          body: "Clear rules improve consistency, control, and predictability."
        -
          number: "03"
          title: "Iteration Improves Quality"
          body: "Testing, validation, and refinement are part of the AI product lifecycle."
        -
          number: "04"
          title: "User Trust Comes From Control"
          body: "Users trust AI more when outputs are editable, understandable, and easy to refine."
  outcomesLabel: "AI product contribution"
  outcomes:
    -
      value: "4"
      label: "Text shadow presets"
    -
      value: "Rules"
      label: "AI behavior defined"
    -
      value: "Canvas"
      label: "Rendering and editing aligned"
    -
      value: "Loop"
      label: "Scenario validation model"
  hideOutcomesSummary: true
  endImage:
    src: "./assets/textshadow-image-end.png"
    alt: "Stylised AI brain inside a violet container connected to a typographic letter T with selection handles - a calm closing visual after the case study"
    caption: "A small breather - the end of a long, detailed case study."
